[package]
name = "blazecache"
version = "0.1.0"
edition = "2024"
description = "High-performance distributed cache server with binary protocol"
license = "MIT"
repository = "https://github.com/nasrullo/blazecache"
keywords = ["cache", "distributed", "performance", "binary-protocol"]
categories = ["caching", "network-programming"]

[[bin]]
name = "blazecache"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22.1"
ciborium = "0.2"
bytes = "1.5"
chrono = "0.4.42"
core_affinity = "0.8"
fastrand = "2.0"
fnv = "1.0"
futures = "0.3"
lazy_static = "1.4"
lru = "0.16.2"
lz4_flex = "0.12.0"
num_cpus = "1.16"
parking_lot = "0.12"
quinn = "0.11"
quinn-proto = "0.11"
rcgen = "0.14.6"
reqwest = { version = "0.12.28", features = ["json"] }
rustls = "0.23"
rustls-native-certs = "0.7"
rustls-pemfile = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-rustls = "0.26"
toml = "0.9.10+spec-1.1.0"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports", "async_tokio"] }
rand = { version = "0.9.2", features = ["small_rng", "std", "alloc"] }
tempfile = "3.10"

[[bench]]
name = "cache_performance"
harness = false

[[bench]]
name = "sharded_cache_benchmark"
harness = false

[[bench]]
name = "ttl_benchmark"
harness = false

[[bench]]
name = "bottleneck_benchmarks"
harness = false

[[bench]]
name = "clear_benchmark"
harness = false
