[package]
name = "blazecache"
version = "0.1.0"
edition = "2021"
description = "High-performance distributed cache server with binary protocol"
license = "MIT"
repository = "https://github.com/blazecache/blazecache"
keywords = ["cache", "distributed", "performance", "binary-protocol"]
categories = ["caching", "network-programming"]

[[bin]]
name = "blazecache"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"
lru = "0.12"
fnv = "1.0"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
lz4_flex = "0.11"
parking_lot = "0.12"
bytes = "1.5"
core_affinity = "0.8"
lazy_static = "1.4"
num_cpus = "1.16"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
fastrand = "2.0"
chrono = "0.4.42"
toml = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio-test = "0.4"

[[bench]]
name = "cache_performance"
harness = false
