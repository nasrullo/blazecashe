[package]
name = "blazecache"
version = "0.1.0"
edition = "2021"
description = "High-performance distributed cache server with binary protocol"
license = "MIT"
repository = "https://github.com/blazecache/blazecache"
keywords = ["cache", "distributed", "performance", "binary-protocol"]
categories = ["caching", "network-programming"]

[[bin]]
name = "blazecache"
path = "src/main.rs"

[dependencies]
socket2 = { version = "0.5", features = ["all"] }
once_cell = "1.19"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"
lru = "0.12"
fnv = "1.0"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
lz4_flex = "0.11"
parking_lot = "0.12"
bytes = "1.5"
core_affinity = "0.8"
lazy_static = "1.4"
num_cpus = "1.16"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
fastrand = "2.0"
chrono = "0.4.42"
toml = "0.8"
pprof = { version = "0.13", features = ["flamegraph", "protobuf"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.1"
rustls-native-certs = "0.7"
rcgen = "0.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio-test = "0.4"
rand = { version = "0.8", features = ["small_rng"] }

[[bench]]
name = "cache_performance"
harness = false

[[bench]]
name = "sharded_cache_benchmark"
harness = false

[[bench]]
name = "ttl_benchmark"
harness = false

[[bench]]
name = "bottleneck_benchmarks"
harness = false
[[example]]
name = "test_ttl_eviction"
path = "test_ttl_eviction.rs"
