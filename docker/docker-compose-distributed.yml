services:
  blazecache-1:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: blazecache-dist-1
    hostname: blazecache-dist-1
    command: 
      - "blazecache"
      - "--port"
      - "6784"
      - "--udp-port"
      - "6793"
      - "--wal"
      - "--data-dir"
      - "/var/lib/blazecache/data"
      - "--gossip"
      - "--gossip-port"
      - "6785"
    ports:
      - "6784:6784"  # TCP port
      - "6793:6793"  # UDP port
      - "6785:6785"  # Gossip port
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_max_syn_backlog: "4096"
      net.ipv4.tcp_tw_reuse: "1"
    volumes:
      - blazecache-dist-1-data:/var/lib/blazecache/data
    networks:
      - blazecache-distributed-network
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6784 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - RUST_LOG=info

