version: '3.8'

services:
  # Blazecache server cluster
  blazecache-server-1:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: blazecache-server-1
    hostname: blazecache-server-1
    command: 
      - "blazecache"
      - "--port"
      - "6784"
      - "--udp-port"
      - "6793"
      - "--wal"
      - "--data-dir"
      - "/var/lib/blazecache/data"
      - "--gossip"
      - "--gossip-port"
      - "6785"
    ports:
      - "6790:6784"  # Main server port (mapped to avoid conflicts)
      - "6791:6785"  # Gossip port (mapped to avoid conflicts)
      - "6800:6793/udp"  # UDP/QUIC port (mapped to avoid conflicts)
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_max_syn_backlog: "4096"
      net.ipv4.tcp_tw_reuse: "1"
    volumes:
      - blazecache-server-1-data:/var/lib/blazecache/data
    networks:
      - blazecache-network
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6784 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  blazecache-server-2:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: blazecache-server-2
    hostname: blazecache-server-2
    command: 
      - "blazecache"
      - "--port"
      - "6784"
      - "--udp-port"
      - "6793"
      - "--wal"
      - "--data-dir"
      - "/var/lib/blazecache/data"
      - "--gossip"
      - "--gossip-port"
      - "6785"
    ports:
      - "6792:6784"  # Main server port (mapped to different host port)
      - "6794:6785"  # Gossip port (mapped to different host port)
      - "6801:6793/udp"  # UDP/QUIC port (mapped to different host port)
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_max_syn_backlog: "4096"
      net.ipv4.tcp_tw_reuse: "1"
    volumes:
      - blazecache-server-2-data:/var/lib/blazecache/data
    networks:
      - blazecache-network
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6784 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Load test client (Rust)
  loadtest-rust:
    build:
      context: ..
      dockerfile: clients/rust/Dockerfile.loadtest
    container_name: loadtest-rust
    hostname: loadtest-rust
    depends_on:
      - blazecache-server-1
      - blazecache-server-2
    networks:
      - blazecache-network
    environment:
      - SERVER_ADDR=blazecache-server-1:6784,blazecache-server-2:6784
      - NUM_OPS=1000
      - NUM_WORKERS=10
    command: ["cargo", "run", "--release", "--example", "loadtest_100k"]
    profiles:
      - loadtest

  # Load test client (Go)
  loadtest-go:
    build:
      context: ../clients/go
      dockerfile: Dockerfile.loadtest
    container_name: loadtest-go
    hostname: loadtest-go
    depends_on:
      - blazecache-server-1
      - blazecache-server-2
    networks:
      - blazecache-network
    environment:
      - SERVER_ADDR=blazecache-server-1:6784,blazecache-server-2:6784
      - NUM_OPS=1000
      - NUM_WORKERS=10
    command: ["./loadtest"]
    profiles:
      - loadtest

volumes:
  blazecache-server-1-data:
  blazecache-server-2-data:

networks:
  blazecache-network:
    driver: bridge

