version: '3.8'

services:
  blazecache-udp-1:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: blazecache-udp-1
    hostname: blazecache-udp-1
    command: 
      - "blazecache"
      - "--port"
      - "6784"
      - "--udp-port"
      - "6793"
      - "--wal"
      - "--data-dir"
      - "/var/lib/blazecache/data"
      - "--gossip"
      - "--gossip-port"
      - "6785"
    ports:
      - "6784:6784"  # TCP port
      - "6793:6793"  # UDP port
      - "6785:6785"  # Gossip port
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_max_syn_backlog: "4096"
      net.ipv4.tcp_tw_reuse: "1"
      net.core.rmem_max: "134217728"  # 128MB for UDP
      net.core.wmem_max: "134217728"  # 128MB for UDP
    volumes:
      - blazecache-udp-1-data:/var/lib/blazecache/data
    networks:
      - blazecache-udp-network
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6784 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - RUST_LOG=info

  blazecache-udp-2:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: blazecache-udp-2
    hostname: blazecache-udp-2
    command: 
      - "blazecache"
      - "--port"
      - "6784"
      - "--udp-port"
      - "6793"
      - "--wal"
      - "--data-dir"
      - "/var/lib/blazecache/data"
      - "--gossip"
      - "--gossip-port"
      - "6785"
    ports:
      - "6786:6784"  # TCP port (mapped to different host port)
      - "6794:6793"  # UDP port (mapped to different host port)
      - "6787:6785"  # Gossip port (mapped to different host port)
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_max_syn_backlog: "4096"
      net.ipv4.tcp_tw_reuse: "1"
      net.core.rmem_max: "134217728"  # 128MB for UDP
      net.core.wmem_max: "134217728"  # 128MB for UDP
    volumes:
      - blazecache-udp-2-data:/var/lib/blazecache/data
    networks:
      - blazecache-udp-network
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6784 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - RUST_LOG=info

  blazecache-udp-3:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: blazecache-udp-3
    hostname: blazecache-udp-3
    command: 
      - "blazecache"
      - "--port"
      - "6784"
      - "--udp-port"
      - "6793"
      - "--wal"
      - "--data-dir"
      - "/var/lib/blazecache/data"
      - "--gossip"
      - "--gossip-port"
      - "6785"
    ports:
      - "6788:6784"  # TCP port (mapped to different host port)
      - "6795:6793"  # UDP port (mapped to different host port)
      - "6789:6785"  # Gossip port (mapped to different host port)
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_max_syn_backlog: "4096"
      net.ipv4.tcp_tw_reuse: "1"
      net.core.rmem_max: "134217728"  # 128MB for UDP
      net.core.wmem_max: "134217728"  # 128MB for UDP
    volumes:
      - blazecache-udp-3-data:/var/lib/blazecache/data
    networks:
      - blazecache-udp-network
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6784 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - RUST_LOG=info

volumes:
  blazecache-udp-1-data:
  blazecache-udp-2-data:
  blazecache-udp-3-data:

networks:
  blazecache-udp-network:
    driver: bridge

