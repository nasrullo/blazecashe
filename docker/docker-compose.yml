services:
  blazecache-1:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: blazecache-1
    hostname: blazecache-1
    command: 
      - "blazecache"
      - "--port"
      - "6784"
      - "--wal"
      - "--data-dir"
      - "/var/lib/blazecache/data"
      - "--gossip"
      - "--gossip-port"
      - "6785"
    ports:
      - "6784:6784"  # Main server port
      - "6785:6785"  # Gossip port
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_max_syn_backlog: "4096"
      net.ipv4.tcp_tw_reuse: "1"
    volumes:
      - blazecache-1-data:/var/lib/blazecache/data
    networks:
      - blazecache-network
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6784 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  blazecache-2:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: blazecache-2
    hostname: blazecache-2
    command: 
      - "blazecache"
      - "--port"
      - "6784"
      - "--wal"
      - "--data-dir"
      - "/var/lib/blazecache/data"
      - "--gossip"
      - "--gossip-port"
      - "6785"
    ports:
      - "6786:6784"  # Main server port (mapped to different host port)
      - "6787:6785"  # Gossip port (mapped to different host port)
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_max_syn_backlog: "4096"
      net.ipv4.tcp_tw_reuse: "1"
    volumes:
      - blazecache-2-data:/var/lib/blazecache/data
    networks:
      - blazecache-network
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6784 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  blazecache-3:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: blazecache-3
    hostname: blazecache-3
    command: 
      - "blazecache"
      - "--port"
      - "6784"
      - "--wal"
      - "--data-dir"
      - "/var/lib/blazecache/data"
      - "--gossip"
      - "--gossip-port"
      - "6785"
    ports:
      - "6788:6784"  # Main server port (mapped to different host port)
      - "6789:6785"  # Gossip port (mapped to different host port)
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_max_syn_backlog: "4096"
      net.ipv4.tcp_tw_reuse: "1"
    volumes:
      - blazecache-3-data:/var/lib/blazecache/data
    networks:
      - blazecache-network
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6784 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  blazecache-1-data:
  blazecache-2-data:
  blazecache-3-data:

networks:
  blazecache-network:
    driver: bridge
