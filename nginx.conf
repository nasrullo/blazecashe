events {
    worker_connections 1024;
}

http {
    upstream blazecache_cluster {
        least_conn;
        server blazecache-1:6784 max_fails=3 fail_timeout=30s;
        server blazecache-2:6784 max_fails=3 fail_timeout=30s;
        server blazecache-3:6784 max_fails=3 fail_timeout=30s;
        server blazecache-4:6784 max_fails=3 fail_timeout=30s;
        server blazecache-5:6784 max_fails=3 fail_timeout=30s;
        server blazecache-6:6784 max_fails=3 fail_timeout=30s;
        server blazecache-7:6784 max_fails=3 fail_timeout=30s;
        server blazecache-8:6784 max_fails=3 fail_timeout=30s;
        server blazecache-9:6784 max_fails=3 fail_timeout=30s;
        server blazecache-10:6784 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://blazecache_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        location /health {
            proxy_pass http://blazecache_cluster/health;
            proxy_set_header Host $host;
        }

        location /metrics {
            proxy_pass http://blazecache_cluster/metrics;
            proxy_set_header Host $host;
        }
    }
}
